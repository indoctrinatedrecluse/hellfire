plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recluse.hellfire'
    compileSdk 34

    defaultConfig {
        applicationId 'com.recluse.hellfire'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}
